# Builds the self-hosted image and pushes it to GHCR, so an install runs
# `docker compose pull` instead of compiling on the server (deploy/vps).
#
#   push to main         -> :main, :sha-<commit>   (bleeding edge, for testing)
#   push of tag v1.2.3   -> :1.2.3, :1.2, :latest  (what installs get by default)
#   manual run with tag  -> the same as a tag push, for a tag made before this
#                           workflow existed (Actions -> image -> Run workflow)
#
# linux/amd64 only: an arm64 build under QEMU takes too long for Next.js.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to (re)publish, e.g. v0.2.0. It becomes :latest."
        required: true

# A newer push to main cancels an older build, so an older commit never lands
# on :main after a newer one. Releases are never cancelled.
concurrency:
  group: image-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/igorfilippov3/senlo
  # Set only on a manual run: the tag to build instead of the current ref.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || env.RELEASE_TAG != '' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && env.RELEASE_TAG == '' }}
            type=sha,format=long,enable=${{ env.RELEASE_TAG == '' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
