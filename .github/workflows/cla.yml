name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/IgorFilippov3/senlo/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: IgorFilippov3,bot*,dependabot[bot]
          custom-notsigned-prcomment: |
            Thanks for your pull request. Before it can be merged, please sign the [Contributor License Agreement](https://github.com/IgorFilippov3/senlo/blob/main/CLA.md).

            You keep the copyright to your work — the CLA grants a licence so that Senlo can offer a hosted version alongside the AGPL core. It is a one-time step that covers all your future contributions.

            To sign, post the following as a comment on this pull request:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
