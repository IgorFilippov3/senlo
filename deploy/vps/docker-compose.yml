services:
  app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    container_name: senlo-app
    restart: always
    ports:
      - "3000:3000"
    # Read at start, not at build: one image for every install.
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_QUEUE_PREFIX=${REDIS_QUEUE_PREFIX:-senlo}
      - AUTH_SECRET=${AUTH_SECRET}
      - LINK_SIGNING_SECRET=${LINK_SIGNING_SECRET:-}
      - SECRETS_KEY=${SECRETS_KEY:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # APP_URL, or the old NEXT_PUBLIC_APP_URL from an existing .env.
      - APP_URL=${APP_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}
      - INITIAL_USERS=${INITIAL_USERS}
      - IS_DEMO_MODE=${IS_DEMO_MODE:-${NEXT_PUBLIC_IS_DEMO_MODE:-false}}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
    volumes:
      - uploads_data:/app/apps/web/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    container_name: senlo-worker
    restart: always
    command: pnpm worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_QUEUE_PREFIX=${REDIS_QUEUE_PREFIX:-senlo}
      # The worker builds unsubscribe and tracking links for campaign mail, so
      # it needs the public URL and the secret those links are signed with.
      - APP_URL=${APP_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
      - AUTH_SECRET=${AUTH_SECRET}
      - LINK_SIGNING_SECRET=${LINK_SIGNING_SECRET:-}
      - SECRETS_KEY=${SECRETS_KEY:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: senlo-db
    restart: always
    environment:
      - POSTGRES_USER=senlo_user
      - POSTGRES_PASSWORD=senlo_password
      - POSTGRES_DB=senlo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senlo_user -d senlo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: senlo-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  uploads_data:
