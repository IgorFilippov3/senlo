openapi: 3.1.0
info:
  title: Senlo Public API
  version: 1.0.0
  summary: Send transactional email and feed contact events into automations.
  description: |
    Every request to `/api/events`, `/api/triggered`, `/api/automations/cancel`
    and `/api/workflows` is authenticated with an
    API key sent as a bearer token:

    ```
    Authorization: Bearer snl_your_api_key
    ```

    A key belongs to one workspace. The workspace is resolved from the key, so no
    workspace or project id appears in any request body.

    The request schemas in this file mirror `EventRequestSchema` and
    `TriggeredEmailRequestSchema` in `packages/core`, which are what the routes
    enforce. When you change one, change the other.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: https://senlo.io
    description: Senlo Cloud
  - url: "{baseUrl}"
    description: Self-hosted Senlo
    variables:
      baseUrl:
        default: http://localhost:3000
        description: The address your instance is reached at (`APP_URL`).
security:
  - bearerAuth: []
tags:
  - name: Emails
    description: Send one transactional email from a trigger.
  - name: Events
    description: Create and update contacts and start automations.
  - name: Automations
    description: Automations as data - export, create from an export, publish.
  - name: Unsubscribe
    description: Endpoints recipients reach from the links Senlo puts in every email.
  - name: Provider webhooks
    description: Endpoints your delivery provider calls with delivery, bounce and complaint events.
paths:
  /api/triggered:
    post:
      operationId: send-triggered-email
      summary: Send a triggered email
      description: |
        Queues one email from a trigger. The trigger must belong to the workspace
        the API key is scoped to, and must be a triggered (API) trigger.

        A `200` means the email is queued, not that the provider accepted it.
        Delivery status shows up in the trigger's delivery log.

        `locale` picks the trigger's template for that locale when one is set,
        otherwise the trigger's default template. The match is exact and
        case-sensitive.
      tags: [Emails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggeredEmailRequest"
            examples:
              orderConfirmation:
                summary: Order confirmation
                value:
                  id: 12
                  to: customer@example.com
                  locale: en
                  data:
                    order:
                      number: A-1049
                      total: "42.00"
      responses:
        "200":
          description: The email is queued.
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                    examples: ["Email queued successfully"]
        "400":
          description: |
            The body failed validation (`to` missing or not an email, no `id`),
            the trigger is not an API trigger, or the workspace has no email
            provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validation:
                  value:
                    error: id (trigger id) is required
                    details:
                      fieldErrors:
                        id: ["id (trigger id) is required"]
                      formErrors: []
                noProvider:
                  value:
                    error: "No email provider is selected for this workspace. Choose one in the Senlo app under workspace Settings → Email Provider."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "404":
          description: The trigger, its template or the provider was not found in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Campaign not found
                details:
                  resource: Campaign
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/events:
    post:
      operationId: send-event
      summary: Send a contact event
      description: |
        Identifies a contact by email, applies the event to it, stores the event
        in the contact's history and starts every active automation whose
        trigger listens for that event name.

        Three names are system events; any other valid name is a custom event.

        | Event | Contact must exist | What it does |
        | --- | --- | --- |
        | `contact_added` | no | Creates the contact, or updates `name` and replaces `metadata` of an existing one. |
        | `contact_updated` | yes | Updates `name` and `locale`, merges `metadata` into the contact's metadata. |
        | `tag_added` | yes | Adds `payload.tags` to the contact's tags, without duplicates. |
        | any other name | no, created if missing | A custom event. Merges `metadata` into an existing contact. |

        `metadata` is contact attributes. `payload` is the event's data: the
        automation's emails read it as `{{event.*}}`.

        With an `Idempotency-Key`, a repeat of a key the workspace has already
        used changes and starts nothing and answers `200` with the contact.
      tags: [Events]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique per event within the workspace. Wins over `idempotencyKey` in the body.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
            examples:
              contactAdded:
                summary: New signup
                value:
                  event: contact_added
                  email: user@example.com
                  name: Jean-Pierre
                  locale: fr
                  metadata:
                    plan: premium
              tagAdded:
                summary: Tag an existing contact
                value:
                  event: tag_added
                  email: user@example.com
                  payload:
                    tags: [onboarded]
              customEvent:
                summary: Custom event with a payload
                value:
                  event: invoice_failed
                  email: customer@example.com
                  payload:
                    invoiceId: in_1049
                    amount: 42
                    currency: EUR
      responses:
        "200":
          description: The event was applied and matching automations were started.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/Contact"
        "400":
          description: |
            The body failed validation: `email` missing or invalid, a malformed
            `event` name, `payload` over 32 KB, `tag_added` without
            `payload.tags`, or an idempotency key over 255 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Email is required
                details:
                  fieldErrors:
                    email: ["Email is required"]
                  formErrors: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "404":
          description: "`contact_updated` or `tag_added` for an address that is not a contact yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Contact not found
                details:
                  resource: Contact
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/automations/cancel:
    post:
      operationId: cancel-automation-runs
      summary: Cancel a contact's automation runs
      description: |
        Ends the contact's runs in progress (`CANCELLED`), in every automation
        of the workspace or in one (`workflowId`). Their remaining steps do not
        run. Use it when something in your app makes a flow pointless: the
        invoice was paid, the user deleted their account. The contact can
        enter the automation again on its next event.
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                workflowId:
                  type: integer
                  description: Only runs of this automation. Without it, every automation of the workspace.
            examples:
              all:
                summary: Every automation
                value:
                  email: user@example.com
              one:
                summary: One automation
                value:
                  email: user@example.com
                  workflowId: 12
      responses:
        "200":
          description: Runs cancelled; `cancelled` is how many (0 when none was in progress).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [cancelled]
                    properties:
                      cancelled:
                        type: integer
        "400":
          description: "`email` missing or invalid, `workflowId` not a positive integer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No contact with this email, or no such automation, in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/workflows:
    post:
      operationId: create-workflow
      summary: Create an automation from an export
      description: |
        Creates a draft automation from the JSON `GET /api/workflows/{id}`
        returns (or the editor's Export). Each email step's `emailRef` is
        mapped to a trigger of the workspace: by `emails`, else by name; one
        that matches none is a 400. HTTP header values are not part of an
        export and are entered again before going live.
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow:
                  $ref: "#/components/schemas/WorkflowExport"
                name:
                  type: string
                  maxLength: 255
                emails:
                  type: object
                  description: "`emailRef` to trigger id; `null` leaves the step empty."
                  additionalProperties:
                    type: integer
                    nullable: true
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRef"
        "400":
          description: Not an export, unsupported version, unusable settings or steps, or emails without a trigger (`details.reasons`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/workflows/{id}:
    get:
      operationId: export-workflow
      summary: Export an automation
      description: The automation's saved draft and settings, with trigger names instead of ids and without header values.
      tags: [Automations]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/WorkflowExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No automation with this id in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/workflows/{id}/publish:
    post:
      operationId: publish-workflow
      summary: Publish an automation
      description: Goes live with the editor's checks and publishes the draft as a new version.
      tags: [Automations]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRef"
        "400":
          description: The draft cannot go live; `details.reasons` lists why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No automation with this id in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/unsubscribe/{token}:
    post:
      operationId: unsubscribe-one-click
      summary: One-click unsubscribe
      description: |
        The address the `List-Unsubscribe` header of every email points at.
        Mail providers such as Gmail and Yahoo post to it when the recipient
        clicks their built-in unsubscribe button (RFC 8058). You do not call it
        yourself.

        Responses are plain text, not JSON.
      tags: [Unsubscribe]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The signed token Senlo put in the email.
          schema:
            type: string
      responses:
        "200":
          description: The recipient is unsubscribed (or already was).
          content:
            text/plain:
              schema:
                type: string
                examples: ["Unsubscribed"]
        "400":
          description: The token is invalid, or it is a legacy unsigned token that has to be confirmed on the unsubscribe page.
          content:
            text/plain:
              schema:
                type: string
                examples: ["Invalid token"]
        "404":
          description: The recipient was not found.
          content:
            text/plain:
              schema:
                type: string
                examples: ["Recipient not found"]
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Unsubscribe failed.
          content:
            text/plain:
              schema:
                type: string
                examples: ["Unsubscribe failed"]
  /api/webhooks/resend:
    post:
      operationId: resend-webhook
      summary: Resend webhook
      description: |
        Paste this URL into a Resend webhook. Senlo verifies the Svix signature
        with the webhook signing secret saved on the provider in Senlo, then
        applies `email.delivered`, `email.bounced` and `email.complained`.
        Other event types are acknowledged and ignored.
      tags: [Provider webhooks]
      security: []
      requestBody:
        required: true
        description: The event exactly as Resend sends it.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/WebhookInvalidPayload"
        "401":
          $ref: "#/components/responses/WebhookUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/webhooks/postmark:
    post:
      operationId: postmark-webhook
      summary: Postmark webhook
      description: |
        Paste this URL into a Postmark webhook and add a custom header
        `X-Postmark-Secret` with the webhook secret saved on the provider in
        Senlo. Senlo applies `Delivery`, `Bounce`, `SpamComplaint`, `Open` and
        `Click` records. Other record types are acknowledged and ignored.
      tags: [Provider webhooks]
      security: []
      parameters:
        - name: X-Postmark-Secret
          in: header
          required: true
          description: The webhook secret saved on the Postmark provider in Senlo.
          schema:
            type: string
      requestBody:
        required: true
        description: The record exactly as Postmark sends it.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/WebhookInvalidPayload"
        "401":
          $ref: "#/components/responses/WebhookUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/webhooks/sendgrid:
    post:
      operationId: sendgrid-webhook
      summary: SendGrid webhook
      description: |
        Paste this URL into a SendGrid Event Webhook with Signed Event Webhook
        turned on, and save its Verification Key on the provider in Senlo.
        Senlo verifies the ECDSA signature and the timestamp (at most 25 hours
        old), then applies `delivered`, `bounce`, `spamreport` and `dropped`
        events from the batch; a drop counts only for an address reason
        (`Bounced Address`, `Invalid Address`, `Spam Reporting Address`).
        Other event types are acknowledged and ignored.
      tags: [Provider webhooks]
      security: []
      parameters:
        - name: X-Twilio-Email-Event-Webhook-Signature
          in: header
          required: true
          description: Base64 ECDSA signature of the timestamp followed by the raw body.
          schema:
            type: string
        - name: X-Twilio-Email-Event-Webhook-Timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: The batch of events exactly as SendGrid sends it.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        "200":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/WebhookInvalidPayload"
        "401":
          $ref: "#/components/responses/WebhookUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/webhooks/mailjet:
    post:
      operationId: mailjet-webhook
      summary: Mailjet webhook
      description: |
        Enter this URL in Mailjet's event tracking with the webhook secret
        saved on the provider in Senlo as the basic auth password:
        `https://senlo:<secret>@<host>/api/webhooks/mailjet`. Senlo applies
        `sent`, `spam`, permanent `bounce` and `blocked` events whose error is
        about the address. Single and grouped events are accepted; other
        event types are acknowledged and ignored.
      tags: [Provider webhooks]
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          description: "`Basic` with the webhook secret as the password, sent by Mailjet from the URL."
          schema:
            type: string
      requestBody:
        required: true
        description: One event, or an array of events with Group events on, exactly as Mailjet sends them.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - type: array
                  items:
                    type: object
      responses:
        "200":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/WebhookInvalidPayload"
        "401":
          $ref: "#/components/responses/WebhookUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key from Workspace → API Keys, starting with `snl_`.
  parameters:
    WorkflowId:
      name: id
      in: path
      required: true
      description: The automation's id (in the editor's URL).
      schema:
        type: integer

  schemas:
    WorkflowRef:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [id, status]
          properties:
            id:
              type: integer
            status:
              type: string
              enum: [DRAFT, ACTIVE, PAUSED]
    WorkflowExport:
      type: object
      required: [format, version, name, settings, nodes, edges]
      properties:
        format:
          type: string
          const: senlo.workflow
        version:
          type: integer
          const: 1
        name:
          type: string
        description:
          type: string
          nullable: true
        settings:
          type: object
          description: "`kind`, `goal`, `entry`, as in the editor's Settings."
        nodes:
          type: array
          items:
            type: object
            required: [id, type, data]
            properties:
              id:
                type: string
              type:
                type: string
                description: trigger, action, delay, condition, wait_event, update_contact, http_request, exit
              data:
                type: object
                description: The step's options; an email step has `emailRef` (its trigger's name).
        edges:
          type: array
          items:
            type: object
            required: [id, source, target]
            properties:
              id:
                type: string
              source:
                type: string
              target:
                type: string
              sourceHandle:
                type: string
                nullable: true
                description: "`yes` or `no` from a Condition or Wait for event."
    TriggeredEmailRequest:
      type: object
      required: [to]
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          description: Trigger id. Either `id` or `campaignId` is required; `id` wins if both are sent.
          examples: [12]
        campaignId:
          oneOf:
            - type: integer
            - type: string
          deprecated: true
          description: Older name of `id`, still accepted.
        to:
          type: string
          format: email
          description: The recipient. One address per request.
        data:
          type: object
          additionalProperties: true
          description: 'Values for the template''s merge tags, e.g. `{ "order": { "total": 42 } }` for `{{order.total}}`.'
        locale:
          type: string
          description: Picks the trigger's template for this locale (e.g. `en`, `de`). Exact, case-sensitive match.
        subject:
          type: string
          description: Replaces the template's subject for this send. Merge tags are resolved in it.
    EventRequest:
      type: object
      required: [event, email]
      properties:
        event:
          type: string
          pattern: "^[a-z0-9][a-z0-9_.:-]{0,63}$"
          description: |
            `contact_added`, `contact_updated`, `tag_added`, or any custom name:
            lowercase letters, digits and `_ . : -`, 64 characters at most.
        email:
          type: string
          format: email
        name:
          type: string
        locale:
          type: string
          description: The contact's locale. Automations send the trigger's template for it.
        metadata:
          type: object
          additionalProperties: true
          description: Contact attributes, merged into the contact. Not part of the event.
        payload:
          type: object
          additionalProperties: true
          description: |
            The event's data, at most 32 KB of JSON: `{{event.*}}` in the
            automation's emails. For `tag_added`, `payload.tags` is required: a
            non-empty array of strings.
        idempotencyKey:
          type: string
          maxLength: 255
          description: Same as the `Idempotency-Key` header.
    Contact:
      type: object
      required: [id, projectId, email, unsubscribed, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
          description: The workspace id.
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        locale:
          type: [string, "null"]
        meta:
          type: [object, "null"]
          additionalProperties: true
          description: The contact's metadata.
        unsubscribed:
          type: boolean
        unsubscribedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A human-readable message.
        details:
          type: object
          additionalProperties: true
          description: Present on some errors. Validation errors carry `fieldErrors` (field name → messages) and `formErrors`.
  responses:
    Unauthorized:
      description: The `Authorization` header is missing or malformed, or the key does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              value:
                error: Missing or invalid Authorization header
            invalid:
              value:
                error: Invalid API key
    QuotaExceeded:
      description: Senlo Cloud only. The organization has reached a monthly limit of its plan. The message says which one and when it resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited. Wait for the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds until the next request is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many requests
    InternalError:
      description: Something failed on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Internal server error
    WebhookAccepted:
      description: Accepted. Also returned for events Senlo ignores, so the provider stops retrying.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
    WebhookInvalidPayload:
      description: The body is not JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_payload
    WebhookUnauthorized:
      description: The signature or shared secret does not match, or no webhook secret is saved on the provider.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidSignature:
              value:
                error: invalid_signature
            notConfigured:
              value:
                error: secret_not_configured
